<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Embedded firmware and hardware — Evans Klenam Kwashie-Seyram</title>
<desc id="desc">A restrained Swiss-style typographic poster with a twelve-column grid, bold technical typography, a red disc and orbit lines.</desc>
<style>
text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.grid{stroke:#2c2c2c;stroke-width:1;opacity:.72}
.name{font-size:22px;font-weight:700;letter-spacing:2.2px;fill:#f2f0ea}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#a3a3a3}
.headline{font-size:100px;font-weight:800;letter-spacing:-5px;fill:#f2f0ea;animation:rise 1.1s cubic-bezier(.16,1,.3,1) .15s both}
.sub{font-size:21px;font-weight:500;fill:#f2f0ea}
.micro{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#a3a3a3}
.disc{transform-origin:910px 235px;animation:arrive 1.3s cubic-bezier(.16,1,.3,1) both}
.orbit{transform-origin:910px 235px;animation:orbit 42s linear infinite}
.rule{transform-origin:left;animation:reveal 1s ease-out .45s both}
@keyframes arrive{from{transform:scale(.05);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="12" fill="#121212"/>
<g class="grid"><path d="M48 0V560M140 0V560M232 0V560M324 0V560M416 0V560M508 0V560M600 0V560M692 0V560M784 0V560M876 0V560M968 0V560M1060 0V560M1152 0V560"/></g>
<text class="name" x="48" y="62">EVANS KLENAM KWASHIE-SEYRAM</text>
<text class="eyebrow" x="48" y="112">EMBEDDED SYSTEMS / ENGINEERING PORTFOLIO</text>
<g class="headline"><text x="44" y="245">FIRMWARE</text><text x="44" y="354">&amp; HARDWARE</text></g>
<rect class="rule" x="48" y="390" width="1104" height="2" fill="#f2f0ea"/>
<text class="sub" x="48" y="438">UAV · AUTONOMOUS SYSTEMS · CUSTOM PCBs</text>
<text class="micro" x="48" y="490">SCHEMATIC → LAYOUT → BRING-UP → FIRMWARE</text>
<g class="disc"><circle cx="910" cy="235" r="92" fill="#ff4436"/></g>
<g class="orbit" fill="none" stroke="#f2f0ea" stroke-width="2" opacity=".8"><ellipse cx="910" cy="235" rx="125" ry="54" transform="rotate(-28 910 235)"/><ellipse cx="910" cy="235" rx="145" ry="69" transform="rotate(48 910 235)" stroke-width="1"/></g>
<circle cx="1028" cy="184" r="5" fill="#f2f0ea"/>
<text class="micro" x="1152" y="530" text-anchor="end">GHANA · 2026</text>
</svg>